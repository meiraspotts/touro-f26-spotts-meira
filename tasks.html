
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks | Between Classes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">

    <!--NAVIGATION-->
      <header class="nav">
        <nav>
          <h3>Between Classes</h3>
          <div class="nav-links">
            <p><a href="home.html">Home</a></p>
            <p><a href="tasks.html">Tasks</a></p>
            <p><a href="schedule.html">Schedule</a></p>
          </div>
        </nav>
      </header>

    <!--INPUT TASKS SECTION-->
      <section class="input">
        <h1>Add classes, assignments, and activities</h1>

        <h2>Classes</h2>
          <p><label for="class-name">Class Name</label> <input id="class-name" name="class-name" /></p>
          <p><label for="class-day">Day</label> <input id="class-day" name="class-day" /></p>
          <p><label for="class-start">Start Time</label> <input id="class-start" name="class-start" /></p>
          <p><label for="class-end-time">End Time</label> <input id="class-end-time" name="class-end-time" /></p>
          <p><button>Add Class</button></p>

        <h2>Assignments</h2>
          <p><label for="assignment-title">Title</label> <input id="assignment-title" name="assignment-title" /></p>
          <p><label for="due-date">Due Date</label> <input id="due-date" name="due-date" /></p>
          <p><label for="assignment-estimated">Estimated Time</label> <input id="assignment-estimated" name="assignment-estimated" /></p>
          <p><label for="assignment-priority">Priority</label> <input id="assignment-priority" name="assignment-priority" /></p>
          <p><button>Add Assignment</button></p>

        <h2>Personal Activities</h2>
          <p><label for="activity-name">Activity Name</label> <input id="activity-name" name="activity-name" /></p>
          <p><label for="activity-day">Day</label> <input id="activity-day" name="activity-day" /></p>
          <p><label for="activity-start">Start Time</label> <input id="activity-start" name="activity-start" /></p>
          <p><label for="activity-end">End Time</label> <input id="activity-end" name="activity-end" /></p>
          <p><label for="activity-priority">Priority</label> <input id="activity-priority" name="activity-priority" /></p>
          <p><button>Add Activity</button></p>
      </section>

      <section class="generate">
        <p><a href="schedule.html">Generate Schedule</a></p>
      </section>

    <!--FOOTER-->
      <footer class="footer">
        <p>© 2026 Between Classes</p>
      </footer>

    </main>
  </body>
</html>
